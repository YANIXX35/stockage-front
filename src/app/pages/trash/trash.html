<div class="app-layout">
  <app-sidebar></app-sidebar>
  <div class="app-main">
    <app-topbar title="Corbeille"></app-topbar>
    <div class="page-content">
      @if (loading) { <div class="loading">Chargement...</div> }
      @if (!loading && files.length === 0) {
        <div class="empty-state">
          <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="28" height="28"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </div>
          <p>La corbeille est vide.</p>
        </div>
      }
      <div class="files-list">
        @for (f of files; track f.id) {
          <div class="file-row deleted">
            <span class="file-icon">{{ storage.getFileIcon(f.type_mime) }}</span>
            <span class="file-name">{{ f.nom_original }}</span>
            <span class="file-size">{{ storage.formatBytes(f.taille) }}</span>
            <div class="file-actions">
              <button (click)="restore(f.id)" title="Restaurer"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg> Restaurer</button>
              <button (click)="deletePermanent(f.id)" title="Supprimer définitivement" class="btn-danger"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Supprimer</button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
