<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg></span>
      StorageApp
    </div>
    <h2>Connexion</h2>
    @if (error) { <div class="auth-error">{{ error }}</div> }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="mon@email.com"
               autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="pass-wrap">
          <input [type]="showPass ? 'text' : 'password'" formControlName="password" placeholder="••••••"
                 autocomplete="current-password" autocapitalize="none" autocorrect="off">
          <button type="button" class="pass-toggle" (click)="showPass = !showPass" tabindex="-1" aria-label="Afficher/masquer le mot de passe">
            @if (!showPass) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            }
          </button>
        </div>
      </div>
      <button type="submit" class="btn-submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
    <p class="auth-switch"><a routerLink="/login/forgot-password" class="forgot-link">Mot de passe oublié ?</a></p>
    <p class="auth-switch">Pas de compte ? <a routerLink="/login/register">Créer un compte</a></p>
  </div>
</div>
