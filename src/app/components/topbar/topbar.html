<header class="topbar">
  <button class="topbar-menu-btn" (click)="ui.toggleSidebar()" aria-label="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <h1 class="topbar-title">{{ title }}</h1>
  <div class="topbar-user">
    @if (auth.currentUser) {
      <div class="user-avatar">{{ auth.currentUser.prenom[0] }}{{ auth.currentUser.nom[0] }}</div>
      <span class="user-name">{{ auth.currentUser.prenom }} {{ auth.currentUser.nom }}</span>
    }
  </div>
</header>
